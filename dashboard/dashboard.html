<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · fx-bug-toolkit</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
  /* Dashboard-specific layout only. Tokens, backdrop, chips, controls, brand,
     scrollbars live in /theme.css (the toolkit design system — see /fx-style). */
  body{overflow-y:auto}

  .topbar{position:sticky; top:0; z-index:7; display:flex; align-items:center; gap:14px;
    height:56px; padding:0 clamp(16px,2.5vw,36px); border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#131317,#0f0f12)}
  .summary{font-family:var(--mono); font-size:12.5px; color:var(--dim); white-space:nowrap}
  .summary b{color:var(--amber); font-weight:600}
  .spacer{margin-left:auto}
  .who{font-family:var(--mono); font-size:12px; color:var(--faint)}
  .who b{color:var(--dim); font-weight:500}
  .gen{font-family:var(--mono); font-size:11.5px; color:var(--faint); white-space:nowrap; display:flex; align-items:center; gap:8px}
  .analyzing{display:none; align-items:center; gap:6px; color:var(--amber)}
  .analyzing.on{display:inline-flex}
  .analyzing .pulse{width:7px; height:7px; border-radius:50%; background:var(--amber); animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25} 50%{opacity:1}}

  /* ---------- tabs (section switcher): switching only toggles a class, no re-render ---------- */
  .tabs{position:sticky; top:56px; z-index:6; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    padding:10px clamp(16px,2.5vw,36px); background:var(--bg); border-bottom:1px solid var(--line)}
  .tab{display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12px;
    padding:6px 13px; border-radius:8px; background:var(--panel); border:1px solid var(--line);
    color:var(--dim); cursor:pointer; transition:color .12s,border-color .12s,background .12s}
  .tab:hover{color:var(--ink); border-color:#37373f}
  .tab.active{color:var(--ink); border-color:var(--accent,var(--amber)); background:#17171c}
  .tab.active .dot{box-shadow:0 0 8px var(--accent)}
  .tab .dot{width:7px; height:7px; border-radius:50%; background:var(--accent,var(--amber)); flex:none}
  .tab .n{font-size:11px; color:var(--faint); background:#101015; border:1px solid var(--line); border-radius:20px; padding:1px 8px}
  .tab.active .n{color:var(--accent)}
  .tab[data-k="needinfos"]{--accent:var(--amber)} .tab[data-k="reviews"]{--accent:var(--cyan)} .tab[data-k="my_bugs"]{--accent:var(--blue)}
  /* order toggle — only meaningful for (and shown on) the needinfos tab.
     Match the tabs' padding-based height + center the label (theme .sortbtn is a
     fixed 34px non-flex button, which misaligned it in this flex row). */
  .order-btn{margin-left:auto; display:none; align-items:center; gap:6px;
    height:auto; padding:6px 12px; line-height:1}
  body[data-tab="needinfos"] .order-btn{display:inline-flex}

  .wrap{max-width:1720px; margin:0 auto; padding:18px clamp(16px,2.5vw,36px) 80px}

  /* one panel per section; only the active one shows, and it fades in (no DOM rebuild on switch) */
  .tabpanel{display:none}
  .tabpanel.active{display:block; animation:fadein .16s ease}
  @keyframes fadein{from{opacity:0; transform:translateY(3px)}}

  /* responsive card grid: multi-column on wide, one column on narrow — fills the
     width instead of stranding a column (see /fx-style Layout & density) */
  .cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(480px, 1fr)); gap:10px; align-items:start}
  @media (max-width:520px){ .cards{grid-template-columns:1fr} }
  .card{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:10px; overflow:hidden}
  .tabpanel[data-k="needinfos"] .card{--accent:var(--amber)}
  .tabpanel[data-k="reviews"] .card{--accent:var(--cyan)}
  .tabpanel[data-k="my_bugs"] .card{--accent:var(--blue)}
  .chead{padding:11px 13px; cursor:pointer}
  .chead:hover{background:#17171c}
  .crow{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .card a.id{font-family:var(--mono); font-size:12px; color:var(--accent); text-decoration:none; font-weight:500; flex:none}
  .card a.id:hover{text-decoration:underline}
  .meta{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint); white-space:nowrap; flex:none}
  .briefline{margin-top:6px; font-size:13px; color:var(--dim); line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .card.open .briefline{display:none}
  .caret{font-family:var(--mono); color:var(--faint); font-size:11px; transition:transform .15s}
  .card.open .caret{transform:rotate(90deg); color:var(--accent)}

  .cbody{border-top:1px solid var(--line-soft); padding:12px 13px; display:none}
  .card.open .cbody{display:block}
  .cbody .title{font-size:13.5px; color:var(--ink); font-weight:500; line-height:1.4; margin-bottom:10px}
  .cbody .brief p{margin:0 0 6px; font-size:13px; color:var(--dim); line-height:1.5}
  .cbody .brief .k{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--faint); margin-right:6px}
  .noanalysis{font-family:var(--mono); font-size:11.5px; color:var(--faint); font-style:italic}

  .actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
  .abtn{height:30px; padding:0 12px; border-radius:7px; background:var(--raised); border:1px solid var(--line);
    color:var(--dim); font-family:var(--mono); font-size:11.5px; cursor:pointer; transition:.12s}
  .abtn:hover{color:var(--ink); border-color:#37373f}
  .abtn.primary{color:var(--amber); border-color:var(--amber-dim); background:var(--amber-wash)}
  .abtn.queued{color:var(--green); border-color:rgba(134,210,140,.35); cursor:default}
  .result{margin-top:10px; padding:9px 11px; border-radius:8px; background:#101015; border:1px solid var(--line-soft);
    font-size:12.5px; color:var(--dim); line-height:1.45}
  .result .k{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--green)}

  .pstatus{font-family:var(--mono); font-size:10px; padding:1px 7px; border-radius:5px; border:1px solid var(--line); flex:none}
  .pstatus.blue{color:var(--blue); border-color:rgba(124,194,255,.30)}
  .pstatus.cyan{color:var(--cyan); border-color:rgba(106,215,198,.28)}
  .pstatus.amber{color:var(--amber); border-color:rgba(255,180,84,.30)}
  .pstatus.green{color:var(--green); border-color:rgba(134,210,140,.30)}

  .emptysec{padding:16px; text-align:center; color:var(--faint); font-family:var(--mono); font-size:12px;
    border:1px dashed var(--line); border-radius:10px}

  /* zone header above the "act" cards */
  .zone-h{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--amber-dim); margin:2px 2px 10px}
  .zone-h b{color:var(--amber); font-weight:600}

  /* collapsed "N earlier · not analyzed" divider → reveals a compact ledger */
  .stale-divider{display:flex; align-items:center; gap:12px; margin:18px 0 8px; cursor:pointer;
    font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}
  .stale-divider::before,.stale-divider::after{content:""; flex:1; height:1px; background:var(--line)}
  .stale-divider:hover{color:var(--dim)}
  .stale-divider .caret{transition:transform .15s}
  .stale-divider.open .caret{transform:rotate(90deg); color:var(--amber)}
  .stale-list{display:none; border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .stale-list.open{display:block}

  /* compact one-line ledger row (reference: stale needinfos, my-bugs backlog) */
  .ledger{border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .lrow{display:flex; align-items:center; gap:12px; padding:7px 12px; text-decoration:none; color:inherit;
    border-bottom:1px solid var(--line-soft)}
  .lrow:last-child{border-bottom:none}
  .lrow:hover{background:#17171c}
  .stale-list .lrow:last-child{border-bottom:none}
  .lrow .id{font-family:var(--mono); font-size:11.5px; color:var(--dim); flex:none; width:66px}
  .lrow:hover .id{color:var(--amber)}
  .lrow .lchips{display:flex; gap:5px; flex:none}
  .lrow .lchips .chip{font-size:9.5px; padding:1px 6px}
  .lrow .ltitle{flex:1; min-width:0; font-size:12.5px; color:var(--dim);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lrow .lmeta{font-family:var(--mono); font-size:10.5px; color:var(--faint); flex:none; white-space:nowrap}
  .lrow .lmeta .pstatus{font-size:9.5px}

  .mb-search{flex:1 1 auto; max-width:none; margin-bottom:10px}
  @media (max-width:640px){ .lrow .lchips{display:none} }

  .overlay{position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; color:var(--faint); font-family:var(--mono)}
  .overlay .ring{width:44px; height:44px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--amber);
    animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .overlay .big{font-size:14px; color:var(--dim)}
  .overlay .sub{font-size:12px}
  .hidden{display:none}

  /* ---------- narrow screens ---------- */
  @media (max-width:640px){
    .topbar{gap:10px}
    .who{display:none}                    /* drop the email on small screens */
    .summary{display:none}                /* counts already live in the tabs */
    .tab{padding:5px 10px; font-size:11.5px}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Dashboard <a href="https://github.com/alastor0325/fx-bug-toolkit" target="_blank" rel="noopener noreferrer"><span>· fx-bug-toolkit</span></a></div>
    <div class="summary" id="summary"></div>
    <div class="spacer"></div>
    <div class="who" id="who"></div>
    <div class="gen"><span class="analyzing" id="analyzing"><span class="pulse"></span>analyzing…</span><span id="gen"></span></div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main class="wrap"><div id="panels"></div></main>

  <div class="overlay" id="overlay">
    <div class="ring"></div>
    <div class="big" id="overlaybig">Generating your dashboard…</div>
    <div class="sub" id="overlaysub">first run — reading your needinfos, reviews, and bugs</div>
  </div>

<script src="/dashboard.logic.js"></script>
<script>
const $ = s => document.querySelector(s);
let DATA = null, STATUS = null, QUEUE = [], RESULTS = {};
let lastGen = null;
const openCards = new Set();
const TAB_KEY = 'fxdash.tab';
let activeTab = (()=>{ try { return localStorage.getItem(TAB_KEY) || 'needinfos'; } catch(e){ return 'needinfos'; } })();
const ORDER_KEY = 'fxdash.order';
let sortOrder = (()=>{ try { return localStorage.getItem(ORDER_KEY) || 'newer'; } catch(e){ return 'newer'; } })();
const STALE_KEY = 'fxdash.stale';
let staleOpen = (()=>{ try { return localStorage.getItem(STALE_KEY) === 'true'; } catch(e){ return false; } })();
let myBugsQuery = '';

function tagsHtml(tags){
  return (tags||[]).map(t => `<span class="chip ${tagClass(t.kind)}">${escapeHtml(t.text)}</span>`).join("");
}
function collapsedMeta(it){
  if(it.type === "mybug"){
    const m = patchStatusMeta(it.patch_status);
    return `<span class="pstatus ${m.cls}">${escapeHtml(m.label)}</span>`;
  }
  const who = it.type === "review" && it.author ? ` · ${escapeHtml(it.author)}` : "";
  return `<span>waiting ${waitingLabel(it.waiting_days)}${who}</span>`;
}
function briefLineText(it){
  const b = it.brief;
  if(!b) return "not analyzed yet — run /dashboard-generate";
  return b.ask || b.summary || b.bug || "";
}
function briefBodyHtml(it){
  const b = it.brief;
  if(!b) return `<div class="noanalysis">No analysis yet. Run <b>/dashboard-generate</b> to produce a brief.</div>`;
  const rows = [];
  if(b.bug) rows.push(`<p><span class="k">bug</span>${escapeHtml(b.bug)}</p>`);
  if(b.ask) rows.push(`<p><span class="k">needinfo</span>${escapeHtml(b.ask)}</p>`);
  if(b.summary) rows.push(`<p>${escapeHtml(b.summary)}</p>`);
  if(it.type === "ni" && it.solvable) rows.push(`<p class="k" style="color:var(--green)">✓ looks solvable — ${escapeHtml(it.solvable_reason||"")}</p>`);
  return `<div class="brief">${rows.join("")}</div>`;
}
function actionsHtml(it){
  const acts = actionsForItem(it);
  if(!acts.length) return "";
  const btns = acts.map(a => {
    const key = actionKey(it.id, a.action);
    const done = RESULTS[key];
    const queued = QUEUE.some(q => actionKey(q.id, q.action) === key && q.status !== "done");
    const cls = a.action === "bug-start" ? "primary" : "";
    if(done) return `<button class="abtn queued" disabled>✓ ${escapeHtml(a.label)}</button>`;
    if(queued) return `<button class="abtn queued" disabled>queued: ${escapeHtml(a.label)}</button>`;
    return `<button class="abtn ${cls}" data-action="${escapeHtml(a.action)}">${escapeHtml(a.label)}</button>`;
  }).join("");
  const results = acts.map(a => {
    const r = RESULTS[actionKey(it.id, a.action)];
    return r ? `<div class="result"><span class="k">${escapeHtml(a.label)} — done</span><br>${escapeHtml(r.summary || "see result")}</div>` : "";
  }).join("");
  return `<div class="actions">${btns}</div>${results}`;
}
function cardHtml(it){
  const open = openCards.has(String(it.id)) ? " open" : "";
  return `<article class="card${open}" data-id="${escapeHtml(it.id)}" data-type="${escapeHtml(it.type)}">
    <div class="chead">
      <div class="crow">
        <a class="id" href="${escapeHtml(it.url)}" target="_blank" rel="noopener">${escapeHtml(it.id)}</a>
        ${tagsHtml(it.tags)}
        <span class="meta">${collapsedMeta(it)} <span class="caret">▸</span></span>
      </div>
      <div class="briefline">${escapeHtml(briefLineText(it))}</div>
    </div>
    <div class="cbody">
      <div class="title">${escapeHtml(it.title)}</div>
      ${briefBodyHtml(it)}
      ${actionsHtml(it)}
    </div>
  </article>`;
}
// compact one-line reference row (stale needinfos, my-bugs backlog)
function ledgerRowHtml(it){
  const chips = (it.tags||[]).slice(0,2).map(t=>`<span class="chip ${tagClass(t.kind)}">${escapeHtml(t.text)}</span>`).join("");
  let meta;
  if(it.type === "mybug"){ const m = patchStatusMeta(it.patch_status); meta = `<span class="pstatus ${m.cls}">${escapeHtml(m.label)}</span>`; }
  else meta = `waiting ${waitingLabel(it.waiting_days)}`;
  return `<a class="lrow" href="${escapeHtml(it.url)}" target="_blank" rel="noopener">
    <span class="id">${escapeHtml(it.id)}</span>
    <span class="lchips">${chips}</span>
    <span class="ltitle">${escapeHtml(it.title)}</span>
    <span class="lmeta">${meta}</span></a>`;
}

// Needinfos: prominent "act" cards (analyzed) + a collapsed ledger of the rest.
function needinfosPanel(){
  const all = sortForSection('needinfos', (DATA.sections && DATA.sections.needinfos) || [], sortOrder);
  const { act, rest } = analyzedSplit(all);
  if(!all.length) return `<div class="emptysec">No open needinfos — you're clear.</div>`;
  const actBody = act.length
    ? `<div class="zone-h">Needs you · <b>${act.length}</b></div><div class="cards">${act.map(cardHtml).join("")}</div>`
    : `<div class="emptysec">No recent needinfos to act on — older ones are below.</div>`;
  const restBody = rest.length ? `
    <div class="stale-divider${staleOpen?' open':''}" data-toggle="stale">${rest.length} earlier · not analyzed <span class="caret">▸</span></div>
    <div class="stale-list${staleOpen?' open':''}">${rest.map(ledgerRowHtml).join("")}</div>` : "";
  return actBody + restBody;
}

// Reviews: few; render as cards, expanded by default.
function reviewsPanel(){
  const items = (DATA.sections && DATA.sections.reviews) || [];
  if(!items.length) return `<div class="emptysec">You're clear — no reviews waiting on you.</div>`;
  return `<div class="cards">${items.map(cardHtml).join("")}</div>`;
}

// My-bugs: a searchable compact ledger (a reference, not an action feed).
function myBugsPanel(){
  const items = (DATA.sections && DATA.sections.my_bugs) || [];
  const rows = filterLedger(items, myBugsQuery);
  const body = rows.length ? rows.map(ledgerRowHtml).join("") : `<div class="emptysec">no matches</div>`;
  return `<div class="search mb-search"><input id="mbq" type="text" spellcheck="false" autocomplete="off"
      placeholder="search ${items.length} bugs — id, title, component" value="${escapeHtml(myBugsQuery)}"></div>
    <div class="ledger" id="mb-ledger">${body}</div>`;
}

function panelHtml(sec){
  const body = sec.key === "needinfos" ? needinfosPanel()
    : sec.key === "reviews" ? reviewsPanel()
    : myBugsPanel();
  return `<section class="tabpanel${sec.key===activeTab?' active':''}" data-k="${sec.key}">${body}</section>`;
}
function tabHtml(sec){
  const n = ((DATA.sections && DATA.sections[sec.key]) || []).length;
  return `<button class="tab${sec.key===activeTab?' active':''}" data-k="${sec.key}">
    <span class="dot"></span>${escapeHtml(sec.label)}<span class="n">${n}</span></button>`;
}
function orderBtnHtml(){
  return `<button class="sortbtn order-btn" id="order" title="Sort needinfos by date">${sortOrder==='older'?'↑ oldest first':'↓ newest first'}</button>`;
}
function setActiveTab(k){
  activeTab = k;
  try { localStorage.setItem(TAB_KEY, k); } catch(e){}
  document.body.dataset.tab = k;                 // drives .order-btn visibility (CSS)
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.k === k));
  document.querySelectorAll('.tabpanel').forEach(p => p.classList.toggle('active', p.dataset.k === k));
}

function render(){
  const view = viewMode(DATA, STATUS);
  $('#analyzing').classList.toggle('on', !!view.analyzing);
  if(view.mode === "processing"){ $('#overlay').classList.remove('hidden'); return; }
  $('#overlay').classList.add('hidden');
  $('#summary').innerHTML = `<b>${totalItems(DATA)}</b> items need you`;
  $('#who').innerHTML = DATA.user ? `<b>${escapeHtml(DATA.user)}</b>` : "";
  $('#gen').textContent = DATA.generated_at ? `updated ${generatedAgo(DATA.generated_at, Date.now())}` : "";
  if(!SECTIONS.some(s => s.key === activeTab)) activeTab = SECTIONS[0].key;
  $('#tabs').innerHTML = SECTIONS.map(tabHtml).join("") + orderBtnHtml();
  $('#panels').innerHTML = SECTIONS.map(panelHtml).join("");
  document.body.dataset.tab = activeTab;
}

// tab switch — class toggle only, no DOM rebuild. The order toggle re-sorts NI.
$('#tabs').addEventListener('click', e=>{
  if(e.target.closest('.order-btn')){
    sortOrder = sortOrder === 'newer' ? 'older' : 'newer';
    try { localStorage.setItem(ORDER_KEY, sortOrder); } catch(e){}
    render();
    return;
  }
  const t = e.target.closest('.tab'); if(!t) return;
  setActiveTab(t.dataset.k);
});
// expand / action / stale-toggle within panels
$('#panels').addEventListener('click', e=>{
  if(e.target.closest('a')) return;                     // ledger rows + links open normally
  const btn = e.target.closest('.abtn');
  if(btn){ queueAction(btn); return; }
  const div = e.target.closest('.stale-divider');
  if(div){                                              // reveal/hide the stale ledger (no re-render)
    staleOpen = !staleOpen;
    try { localStorage.setItem(STALE_KEY, staleOpen); } catch(e){}
    div.classList.toggle('open', staleOpen);
    const list = div.nextElementSibling;
    if(list && list.classList.contains('stale-list')) list.classList.toggle('open', staleOpen);
    return;
  }
  const head = e.target.closest('.chead'); if(!head) return;
  const card = head.closest('.card'); const id = card.dataset.id;
  const nowOpen = card.classList.toggle('open');
  if(nowOpen) openCards.add(id); else openCards.delete(id);
});
// my-bugs search — update only the ledger so the input keeps focus (no re-render)
$('#panels').addEventListener('input', e=>{
  if(e.target.id !== 'mbq') return;
  myBugsQuery = e.target.value;
  const led = document.getElementById('mb-ledger');
  if(!led) return;
  const rows = filterLedger((DATA.sections && DATA.sections.my_bugs) || [], myBugsQuery);
  led.innerHTML = rows.length ? rows.map(ledgerRowHtml).join("") : `<div class="emptysec">no matches</div>`;
});
function queueAction(btn){
  const card = btn.closest('.card');
  const it = findItem(card.dataset.id);
  if(!it) return;
  const entry = { ...buildQueueEntry(it, btn.dataset.action), ts: Date.now() };
  btn.disabled = true; btn.classList.add('queued'); btn.textContent = 'queued: ' + btn.textContent;
  fetch('/queue', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(entry) })
    .then(r=>{ if(!r.ok) throw new Error(); QUEUE.push(entry); })
    .catch(()=>{ btn.disabled=false; btn.classList.remove('queued'); btn.textContent = btn.textContent.replace('queued: ',''); });
}
function findItem(id){
  for(const s of SECTIONS){
    const hit = ((DATA.sections||{})[s.key]||[]).find(i => String(i.id) === String(id));
    if(hit) return hit;
  }
  return null;
}

const j = (url) => fetch(url, {cache:'no-store'}).then(r => r.ok ? r.json() : null).catch(()=>null);
function refreshData(){
  return Promise.all([j('/data.json'), j('/queue.json'), j('/results.json')]).then(([d,q,r])=>{
    DATA = d; QUEUE = q || []; RESULTS = r || {};
    // reviews are few → show them expanded by default (still collapsible)
    ((DATA && DATA.sections && DATA.sections.reviews) || []).forEach(rv => openCards.add(String(rv.id)));
    lastGen = d && d.generated_at;
    render();
  });
}
function updateChrome(){
  $('#analyzing').classList.toggle('on', !!viewMode(DATA, STATUS).analyzing);
  if(DATA && DATA.generated_at) $('#gen').textContent = `updated ${generatedAgo(DATA.generated_at, Date.now())}`;
}
function poll(){
  j('/status.json').then(s=>{
    STATUS = s;
    if(s && s.state === "ready" && s.generated_at && s.generated_at !== lastGen) refreshData();
    else updateChrome();
  });
}
refreshData().then(()=>{ poll(); setInterval(poll, 3000); });
</script>
